name: Build and Package ModManager

# 触发工作流的事件
on:
  push:
    branches: [ "main" ]  # 当代码推送到 main 分支时触发
  pull_request:
    branches: [ "main" ]  # 当有 PR 指向 main 分支时触发
  workflow_dispatch:        # 允许你从 GitHub Actions 页面手动触发

jobs:
  build:
    runs-on: windows-latest  # WPF 项目需要在 Windows 环境上构建[reference:1]

    steps:
    # 1. 拉取代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 设置 .NET SDK (请根据你的项目需要调整版本)
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # 确保此版本与你的项目目标框架兼容[reference:2]

    # 3. 还原依赖包
    - name: Restore dependencies
      run: dotnet restore ./WpfApp1/ModManager.csproj

    # 4. 构建项目 (Release 模式)
    - name: Build project
      run: dotnet build ./WpfApp1/ModManager.csproj -c Release --no-restore

    # 5. 发布为独立可执行文件 (这是生成 .exe 的关键步骤)
    - name: Publish as single-file executable
      run: |
        dotnet publish ./WpfApp1/ModManager.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -o ./publish/ModManager
      # -r win-x64: 指定目标平台为 64位 Windows[reference:3]
      # --self-contained true: 发布为独立应用，自带 .NET 运行时[reference:4]
      # -p:PublishSingleFile=true: 将所有内容打包成单个 .exe 文件[reference:5]
      # -p:IncludeNativeLibrariesForSelfExtract=true: 解决原生库的提取问题[reference:6]
      # -o: 指定输出目录

    # 6. 上传 .exe 文件作为构建产物 (Artifact)
    - name: Upload executable as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ModManager-win-x64
        path: ./publish/ModManager/ModManager.exe
