name: CI Build ModManager

# 仅推送/PR 时的持续集成：构建并上传 Artifact，不创建 Release。
# 发版（带版本号与更新信息）请推送 v* 标签，见 release.yml。

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. 拉取代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 设置 .NET SDK（与项目 TargetFramework=net10.0-windows 匹配）
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 3. 发布为独立应用（自带 .NET 运行时）
    - name: Publish project
      shell: pwsh
      run: |
        dotnet publish ./ModManager/ModManager.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -o ./publish/ModManager

    # 4. 上传构建产物（Actions 页面可下载）
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ModManager-win-x64
        path: ./publish/ModManager
