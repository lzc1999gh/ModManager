name: CI Build ModManager

# 仅推送/PR 时的持续集成：验证项目可以构建，不创建发布包。
# 发版（带版本号与更新信息）请推送 v* 标签，见 release.yml。

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. 拉取代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 设置 .NET SDK（与项目 TargetFramework=net10.0-windows 匹配）
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 3. 还原依赖，但不生成发布包
    - name: Restore dependencies
      run: dotnet restore ./ModManager/ModManager.csproj

    # 4. 仅构建项目；发布包由 release.yml 在推送 v* 标签时生成
    - name: Build project
      run: dotnet build ./ModManager/ModManager.csproj -c Release --no-restore
