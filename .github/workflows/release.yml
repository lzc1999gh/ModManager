name: Release ModManager

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: '手动发版版本号（例如 1.2.3），将自动打 v1.2.3 标签并发布'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ github.event.inputs.version }}'.Trim()
            $tag = 'v' + $v
          } else {
            $tag = '${{ github.ref_name }}'
            $v = $tag -replace '^v', ''
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 包 1：框架依赖（不带架构）——体积小，但目标机须装 .NET 10 Desktop Runtime
      - name: Publish framework-dependent
        shell: pwsh
        run: |
          dotnet publish ./ModManager/ModManager.csproj `
            -c Release `
            --self-contained false `
            -o ./publish/framework-dependent

      # 包 2：自包含 win-x64（带架构）——体积大，解压即用
      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          dotnet publish ./ModManager/ModManager.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o ./publish/win-x64

      - name: Package as zip
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/framework-dependent/* `
            -DestinationPath ./ModManager-${{ steps.version.outputs.version }}-portable.zip
          Compress-Archive -Path ./publish/win-x64/* `
            -DestinationPath ./ModManager-${{ steps.version.outputs.version }}-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModManager-${{ steps.version.outputs.version }}
          path: |
            ./publish/framework-dependent
            ./publish/win-x64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ModManager ${{ steps.version.outputs.version }}
          body: |
            ## 下载说明
            ### 自包含版（推荐，无需安装 .NET）
            - `ModManager-${{ steps.version.outputs.version }}-win-x64.zip`，解压后运行 `ModManager.exe`
            ### 框架依赖版（体积小，需已装 .NET 10 Desktop Runtime）
            - `ModManager-${{ steps.version.outputs.version }}-portable.zip`，解压后运行 `ModManager.exe`
          files: |
            ./ModManager-${{ steps.version.outputs.version }}-portable.zip
            ./ModManager-${{ steps.version.outputs.version }}-win-x64.zip
          generate_release_notes: true
